{{define "content"}}
<section class="card form-page">
  <div class="card-header"><div><h2>売上伝票登録</h2><p>下書き保存後、詳細画面で金額と為替を確認して確定します。</p></div><span class="badge warning">下書き</span></div>
  <form method="post" action="/sales" class="record-form">
    <input type="hidden" name="csrf_token" value="{{.CSRF}}">
    <fieldset>
      <legend>伝票情報</legend>
      <div class="form-grid three">
        <label>販売先 <b>必須</b><input name="customer_name" placeholder="例：佐藤 様" required></label>
        <label>売上日 <b>必須</b><input type="date" name="sales_date" value="2026-07-26" required></label>
        <label>備考<input name="notes" placeholder="任意"></label>
      </div>
    </fieldset>
    <fieldset>
      <legend>売上明細</legend>
      <div class="form-grid three">
        <label class="span-two">商品 <b>必須</b>
          <select name="product_id" required><option value="">選択してください</option>{{range .Products}}<option value="{{.ID}}">{{.ProductCode}}｜{{.Brand}} {{.ModelNumber}}（{{productStatus .InventoryStatus}}）</option>{{end}}</select>
        </label>
        <label>数量 <b>必須</b><input type="number" name="quantity" min="1" max="999" value="1" required></label>
        <label>売上通貨 <input name="currency" value="USD" readonly aria-readonly="true"></label>
        <label>売上単価（USD） <b>必須</b><input name="unit_price" inputmode="numeric" value="0" required></label>
      </div>
      <p class="form-hint">売価はUSDで登録し、確定時点の最新USD/JPYレートを売上明細へ固定します。</p>
    </fieldset>
    <div class="form-actions"><a class="button ghost" href="/sales">キャンセル</a><button class="button primary" type="submit">下書き保存</button></div>
  </form>
</section>
{{end}}
